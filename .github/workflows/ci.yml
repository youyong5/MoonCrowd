name: MoonCrowd checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supported-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official current MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon run examples/cli --target native --release
      - run: python3 tools/check_consumer.py
      - run: python3 tools/check_consumer.py --source package
      - run: python3 tools/build_web.py
      - run: node tools/smoke_web.cjs
  reference-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed Apache-2.0 reference implementation
        run: |
          git init /tmp/rvo2-reference
          git -C /tmp/rvo2-reference fetch --depth=1 https://github.com/snape/RVO2.git 6b4eb00a93a9f3abf723235ff006d6aad3e2f212
          git -C /tmp/rvo2-reference checkout --detach FETCH_HEAD
      - name: Install formatter for independent reference verification
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify JSON and the actual MoonBit reference assertions
        run: |
          python3 tools/test_oracle_verifier.py
          python3 tools/generate_oracle.py --upstream /tmp/rvo2-reference --check
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install official current MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: python3 tools/build_web.py
      - name: Install pinned development-only browser test dependency
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix /tmp/mooncrowd-browser playwright@1.62.1
          /tmp/mooncrowd-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise desktop, mobile touch and offline-file controls
        run: NODE_PATH=/tmp/mooncrowd-browser/node_modules node tools/check_browser.cjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: mooncrowd-browser-report
          path: _build/browser-report/
          retention-days: 14
  published-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install official current MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: Consume exact published version without a workspace override
        run: python3 tools/check_consumer.py --source registry --version 0.1.0
